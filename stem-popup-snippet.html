<!--
  ═══════════════════════════════════════════════════════════════
  CALCULIA — Free STEM Summer Coaching popup
  Matches the existing "Marked Script" design system in style.css
  (uses the same --blackboard / --coral / --lime / --f-display etc.
  CSS variables already defined in your :root, so it inherits your
  site's look automatically — no new tokens needed).

  HOW TO INSTALL (3 steps):
  1. Paste the <style> block below into style.css (anywhere, e.g.
     right after the ANIMATIONS section).
  2. Paste the HTML block into whichever page(s) you want the popup
     to appear on — right before the closing </body> tag, after
     your footer markup.
  3. Paste the <script> block into script.js (or keep it inline
     right after the HTML — either works).

  BEHAVIOUR:
  - Pops up ~1.2s after page load (once per browser session — set
    via sessionStorage so returning visitors on the same visit
    aren't nagged twice; change SHOWN_KEY or remove the check if
    you'd rather show it on every page load).
  - Clicking the card itself opens the WhatsApp group link in a new
    tab, then closes the popup.
  - Clicking the "X" closes it without redirecting.
  - Clicking anywhere else on the page (the dimmed overlay) also
    closes it.
  - Esc key closes it too.
═══════════════════════════════════════════════════════════════ -->


<!-- ══════════ 1. CSS — add to style.css ══════════ -->
<style>
/* ── STEM SUMMER COACHING POPUP ── */
.stem-popup-overlay {
  position: fixed; inset: 0; z-index: 1000;
  background: rgba(16,35,29,.88);
  backdrop-filter: blur(6px);
  display: flex; align-items: center; justify-content: center;
  padding: 1.5rem;
  opacity: 0; pointer-events: none;
  transition: opacity .35s ease;
}
.stem-popup-overlay.is-visible { opacity: 1; pointer-events: auto; }
.stem-popup-overlay.is-hidden { display: none; }

.stem-popup-card {
  position: relative;
  width: 100%; max-width: 430px;
  background: linear-gradient(160deg, var(--blackboard-mid), var(--blackboard-high));
  border: 1px solid var(--border-lime);
  border-radius: 16px;
  padding: 2.5rem 2.1rem 2.1rem;
  text-align: center;
  cursor: pointer;
  box-shadow: 0 30px 70px rgba(0,0,0,.55);
  transform: translateY(16px) scale(.97);
  transition: transform .35s ease;
}
.stem-popup-overlay.is-visible .stem-popup-card { transform: translateY(0) scale(1); }

.stem-popup-close {
  position: absolute; top: .9rem; right: .9rem;
  width: 32px; height: 32px; border-radius: 50%;
  background: rgba(238,244,240,.08); border: 1px solid var(--border);
  color: var(--chalk); font-size: 1.3rem; line-height: 1;
  display: flex; align-items: center; justify-content: center;
  transition: background var(--transition), color var(--transition);
}
.stem-popup-close:hover { background: var(--coral); color: var(--blackboard); }

.stem-popup-badge {
  display: inline-block; font-family: var(--f-mono); font-size: .65rem;
  letter-spacing: .1em; text-transform: uppercase; color: var(--lime);
  background: rgba(198,255,61,.1); border: 1px solid var(--border-lime);
  border-radius: 20px; padding: .35rem .9rem; margin-bottom: 1.2rem;
}

.stem-popup-eyebrow {
  font-family: var(--f-display); font-weight: 700; font-size: 1.55rem;
  color: var(--coral); letter-spacing: .04em; margin-bottom: -.4rem;
}
.stem-popup-title {
  font-family: var(--f-display); font-weight: 700; color: var(--chalk);
  font-size: clamp(1.85rem,5vw,2.35rem); line-height: 1.05; margin-bottom: .85rem;
}
.stem-popup-tag {
  font-family: var(--f-mark); font-size: 1.2rem; color: var(--lime);
  margin-bottom: 1.15rem; transform: rotate(-1deg);
}
.stem-popup-subjects {
  font-size: .8rem; color: var(--chalk-dim); margin-bottom: 1.15rem; letter-spacing: .02em;
}
.stem-popup-meta {
  display: flex; flex-direction: column; gap: .4rem;
  font-size: .82rem; color: var(--chalk-dim); margin-bottom: 1.7rem;
}
.stem-popup-cta {
  display: inline-flex; align-items: center; justify-content: center; gap: .5rem;
  width: 100%; padding: .9rem 1.2rem; background: var(--coral); color: var(--blackboard);
  font-weight: 700; font-size: .9rem; border-radius: 8px;
  transition: background var(--transition), transform var(--transition);
}
.stem-popup-card:hover .stem-popup-cta { background: var(--lime); transform: translateY(-2px); }

@media (max-width: 480px) {
  .stem-popup-card { padding: 2.2rem 1.5rem 1.7rem; }
}
</style>


<!-- ══════════ 2. HTML — add just before </body> ══════════ -->
<div id="stemPopupOverlay" class="stem-popup-overlay">
  <div class="stem-popup-card" role="button" tabindex="0" aria-label="Join the Free STEM Summer Coaching WhatsApp group">
    <button class="stem-popup-close" aria-label="Close">&times;</button>
    <span class="stem-popup-badge">100% Online &middot; 4 Saturdays in August</span>
    <div class="stem-popup-eyebrow">FREE</div>
    <div class="stem-popup-title">STEM Summer<br>Coaching</div>
    <div class="stem-popup-tag">Learn. Explore. Innovate. Succeed!</div>
    <div class="stem-popup-subjects">English &middot; Mathematics &middot; Biology &middot; Chemistry &middot; Physics</div>
    <div class="stem-popup-meta">
      <span>Aug 8, 15, 22 &amp; 29, 2026</span>
      <span>11:00 AM &ndash; 1:00 PM (WAT)</span>
    </div>
    <div class="stem-popup-cta">Join the WhatsApp Group &rarr;</div>
  </div>
</div>


<!-- ══════════ 3. JS — add to script.js (or leave inline) ══════════ -->
<script>
(function () {
  var WHATSAPP_LINK = 'https://chat.whatsapp.com/C9wbOLAtmVbCcz2isjR326';
  var SHOWN_KEY = 'calculiaSTEMPopupShown';

  document.addEventListener('DOMContentLoaded', function () {
    var overlay = document.getElementById('stemPopupOverlay');
    if (!overlay) return;

    // Only show once per browser session. Remove this "if" to show on every page load.
    if (sessionStorage.getItem(SHOWN_KEY)) return;

    setTimeout(function () {
      overlay.classList.add('is-visible');
    }, 1200);

    overlay.addEventListener('click', function (e) {
      var closedViaX = !!e.target.closest('.stem-popup-close');
      var clickedCard = !closedViaX && !!e.target.closest('.stem-popup-card');

      if (clickedCard) {
        window.open(WHATSAPP_LINK, '_blank', 'noopener');
      }
      close();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') close();
    });

    function close() {
      overlay.classList.remove('is-visible');
      overlay.classList.add('is-hidden');
      sessionStorage.setItem(SHOWN_KEY, '1');
    }
  });
})();
</script>
